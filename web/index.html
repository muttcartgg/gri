/* Layout: full-bleed field canvas; glass broadcast HUD; full-screen hub screens with a tab bar; sheets dock to the bottom during play */
:root{
  --ink:#090C12; --panel:#121823; --panel2:#19212E; --line:rgba(255,255,255,.09);
  --fg:#EEF2F6; --mute:#8D99A9; --gold:#FFD23F; --los:#4DA3FF; --hot:#FF4D5E; --ok:#3BD98A; --warn:#F2B33D;
  --team:#C8102E; --team2:#FFFFFF; --opp:#0057B8; --btn-ink:#fff;
  --disp:-apple-system,'SF Pro Display','Segoe UI',Roboto,system-ui,sans-serif;
  --body:-apple-system,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
  --dw:800; --dstyle:italic; --dtrack:-.01em;
  color-scheme:dark;
}
:root[data-style="retro"]{--disp:'Silkscreen','Courier New',monospace;--dw:700;--dstyle:normal;--dtrack:.02em}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--fg);font:14px/1.4 var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas{display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.d{font-family:var(--disp);font-weight:var(--dw);font-style:var(--dstyle);letter-spacing:var(--dtrack)}

/* ---------- broadcast scoreboard ---------- */
#sb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;z-index:5;max-width:calc(100% - 120px)}
.sb-main{display:flex;align-items:stretch;background:rgba(8,11,17,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.5);height:42px}
.tm{display:flex;align-items:center;gap:7px;padding:0 11px 0 0;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 34%,transparent),transparent 82%)}
.tm+.tm{border-left:1px solid var(--line)}
.tm .chip{width:6px;align-self:stretch;background:var(--c);box-shadow:0 0 14px var(--c)}
.tm .rk{font:700 11px/1 var(--body);color:var(--mute)}
.tm .ab{font-family:var(--disp);font-weight:var(--dw);font-style:var(--dstyle);font-size:16px;line-height:1;letter-spacing:.02em}
.tm .pos{width:9px;height:6px;border-radius:50%;background:#B8692E;box-shadow:0 0 0 1.5px rgba(255,255,255,.5);opacity:0;transition:opacity .3s}
.tm.has .pos{opacity:1}
.tm .tos{display:flex;flex-direction:column;gap:2px}
.tm .tos i{width:8px;height:2px;border-radius:1px;background:var(--gold)}
.tm .tos i.u{background:rgba(255,255,255,.15)}
.tm .sc{font-family:var(--disp);font-weight:900;font-style:var(--dstyle);font-size:26px;line-height:1;font-variant-numeric:tabular-nums;min-width:1.15em;text-align:right}
.tm .sc.bump{animation:bump .7s ease}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.45);color:var(--gold)}100%{transform:scale(1)}}
.clk{display:flex;align-items:center;gap:7px;padding:0 11px;border-left:1px solid var(--line);font:800 18px/1 var(--disp);font-variant-numeric:tabular-nums}
#qtr{color:var(--mute);font-size:12px}
.pc{display:flex;align-items:center;justify-content:center;padding:0 8px;min-width:38px;background:rgba(255,255,255,.06);font:700 14px/1 var(--disp);color:var(--mute);font-variant-numeric:tabular-nums}
.pc.low{color:var(--hot)}
.sb-sub{display:flex;font:800 12px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase}
.sb-sub span{padding:5px 12px;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);white-space:nowrap}
#dd{background:var(--gold);color:#141414}
#spot,#stam,#wxs{background:rgba(18,24,35,.95);margin-left:-3px}
#stam{color:var(--ok)}
.ibtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);height:38px;min-width:38px;padding:0 10px;border-radius:10px;background:rgba(8,11,17,.86);border:1px solid var(--line);display:grid;place-items:center;z-index:6;font:800 12px var(--body)}
.ibtn svg{width:18px;height:18px}
#pauseBtn{left:max(12px,env(safe-area-inset-left,0px))}
#toBtn{right:max(12px,env(safe-area-inset-right,0px))}
#bulletBtn{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 56px);z-index:6;border-radius:999px;padding:10px 16px;background:rgba(8,11,17,.86);border:1px solid var(--line);font:800 13px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase}
#bulletBtn[aria-pressed="true"]{background:#FF7A1A;color:#120800;border-color:#FF7A1A;box-shadow:0 0 18px #FF7A1A}
#toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 84px);left:50%;transform:translate(-50%,-8px);opacity:0;transition:opacity .2s,transform .2s;font:800 15px/1 var(--disp);text-transform:uppercase;letter-spacing:.04em;background:rgba(18,24,35,.96);padding:9px 16px;border-radius:999px;border:1px solid var(--line);pointer-events:none;z-index:7;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#flag{position:absolute;top:calc(env(safe-area-inset-top,0px) + 124px);left:50%;transform:translateX(-50%) scale(.8);opacity:0;transition:opacity .2s,transform .2s;background:#FFD200;color:#111;font:900 14px/1.2 var(--disp);text-transform:uppercase;padding:9px 16px;border-radius:8px;pointer-events:none;z-index:7;box-shadow:0 8px 24px rgba(0,0,0,.45);white-space:nowrap}
#flag.show{opacity:1;transform:translateX(-50%) scale(1)}
#banner{position:absolute;left:0;right:0;top:36%;display:grid;place-items:center;pointer-events:none;z-index:8;overflow:hidden;padding-block:16px}
#banner .strip{transform:skewX(-12deg) translateX(-130%);background:linear-gradient(90deg,transparent,var(--bc) 14%,var(--bc) 86%,transparent);padding:6px 70px;width:min(980px,100%);text-align:center;opacity:0}
#banner .strip span{display:inline-block;transform:skewX(12deg);font-family:var(--disp);font-weight:900;font-style:var(--dstyle);font-size:clamp(36px,10vw,88px);line-height:1.05;color:var(--btc);text-transform:uppercase;text-shadow:3px 3px 0 rgba(0,0,0,.22)}
#banner.on .strip{animation:sweep 2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes sweep{0%{transform:skewX(-12deg) translateX(-130%);opacity:1}18%{transform:skewX(-12deg) translateX(0);opacity:1}80%{transform:skewX(-12deg) translateX(0);opacity:1}100%{transform:skewX(-12deg) translateX(130%);opacity:0}}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);font:600 12px/1.2 var(--body);color:#C9D4DE;background:rgba(8,11,17,.86);border:1px solid var(--line);padding:7px 13px;border-radius:999px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;pointer-events:none;z-index:4}

/* ---------- in-game sheets ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;padding:34px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,rgba(5,8,13,.94) 36%);display:flex;flex-direction:column;align-items:center;gap:9px;z-index:9}
.sheet h3{margin:0;font:800 12px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:center}
.sheet h3 b{color:var(--fg)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;width:min(760px,100%)}
.play{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 13px;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;transition:transform .12s}
.play::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--team)}
.play.alt::before{background:rgba(255,255,255,.25)}
.play.warn::before{background:var(--warn)}
.play:active{transform:scale(.97)}
.play b{font-family:var(--disp);font-weight:var(--dw);font-style:var(--dstyle);font-size:19px;line-height:1;text-transform:uppercase}
.play small{font-size:11.5px;color:var(--mute)}
#kcv{width:min(420px,92vw);height:auto;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--line);background:#0c1a12}
.btn{background:var(--team);color:var(--btn-ink);border:0;border-radius:12px;padding:13px 24px;font-family:var(--disp);font-weight:var(--dw);font-style:var(--dstyle);font-size:17px;line-height:1;text-transform:uppercase;letter-spacing:.03em}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.light{background:var(--fg);color:#0B0E14}
.btn.danger{background:var(--hot);color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}

/* ---------- modals & screens ---------- */
.modal{position:absolute;inset:0;display:flex;padding:20px 16px;background:rgba(3,5,9,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:30;overflow:auto}
.panel{margin:auto;width:100%;max-width:580px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.panel.wide{max-width:760px}
.eyebrow{font:700 11.5px/1.25 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.screen{position:absolute;inset:0;background:var(--ink);z-index:20;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0}
.h1{font-family:var(--disp);font-weight:900;font-style:var(--dstyle);font-size:clamp(34px,8vw,56px);line-height:.95;text-transform:uppercase;letter-spacing:var(--dtrack)}
.h2{font-family:var(--disp);font-weight:var(--dw);font-style:var(--dstyle);font-size:19px;line-height:1.2;text-wrap:balance}

.badge{--s:40px;width:var(--s);height:calc(var(--s)*1.1);flex:none;display:grid;place-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--c1) 80%,#fff),var(--c1) 45%);color:var(--bt,#fff);border:3px solid var(--c2);clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%);font-family:var(--disp);font-weight:900;font-style:var(--dstyle);font-size:calc(var(--s)*.3);line-height:1;padding-bottom:calc(var(--s)*.18)}
.badge.sm{--s:26px;border-width:2px}
.badge.lg{--s:62px;border-width:4px}
.badge.xl{--s:92px;border-width:5px}

.hub-top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,color-mix(in srgb,var(--team) 34%,var(--ink)),var(--ink));border-bottom:1px solid var(--line);flex:none}
.hub-top .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hub-top .who b{font-family:var(--disp);font-weight:900;font-style:var(--dstyle);font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hub-top .who small{color:var(--mute);font-size:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font:700 12.5px/1 var(--body);white-space:nowrap}
.pill.gold{color:var(--gold)}.pill.ok{color:var(--ok)}.pill.hot{color:var(--hot)}
.tabs{display:flex;gap:4px;padding:6px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-radius:8px;padding:9px 12px;font:700 13.5px/1 var(--body);color:var(--mute);white-space:nowrap}
.tabs button[aria-selected="true"]{background:rgba(255,255,255,.09);color:var(--fg)}
.tabs button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--hot);margin-left:5px;vertical-align:middle}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--team) 22%,var(--panel)),var(--panel) 60%)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.matchup .side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.matchup .side b{font-family:var(--disp);font-weight:var(--dw);font-style:var(--dstyle);font-size:17px;line-height:1.15}
.matchup .side small{color:var(--mute);font-size:12px}
.matchup .vs{font:800 15px var(--disp);color:var(--mute)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:4px 8px;font:800 11px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;background:rgba(255,255,255,.08);color:var(--fg)}
.tag.gold{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
.tag.hot{background:color-mix(in srgb,var(--hot) 22%,transparent);color:#FF8A96}
.tag.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.tag.blue{background:color-mix(in srgb,var(--los) 22%,transparent);color:#8CC4FF}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:700 10.5px/1 var(--body);color:var(--mute);text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
td.n,th.n{text-align:right}
tr.me td{background:color-mix(in srgb,var(--team) 16%,transparent)}
.tw{overflow-x:auto}
.tname{display:flex;align-items:center;gap:8px;min-width:0}
.tname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap;font-size:12px}
.stars i{color:rgba(255,255,255,.18);font-style:normal}
.res-w{color:var(--ok);font-weight:700}.res-l{color:var(--hot);font-weight:700}
.linkbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--mute)}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 6px;border:0;border-bottom:1px solid rgba(255,255,255,.05);background:none;text-align:left;width:100%;border-radius:8px}
.rrow .meta{min-width:0;display:flex;flex-direction:column;gap:3px}
.rrow .meta b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .meta small{color:var(--mute);font-size:12px}
.num{font:800 15px/1 var(--disp);color:var(--mute);width:32px;text-align:center}
.attrs{display:flex;gap:3px 12px;flex-wrap:wrap;font-size:11px;color:var(--mute)}
.attrs span{display:inline-flex;gap:3px;align-items:center}
.sel{outline:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)!important}
.meter{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;border-radius:4px}
.kv{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px}
.kv span:first-child{color:var(--mute)}
.pips{display:flex;gap:4px}.pips i{width:16px;height:6px;border-radius:2px;background:rgba(255,255,255,.12)}.pips i.on{background:var(--team)}
.field-row{display:flex;flex-direction:column;gap:6px}
.field-row label{font:700 11.5px var(--body);color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=search],textarea,select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--fg);font:16px var(--body);width:100%}
textarea{min-height:120px;font:12px/1.4 ui-monospace,Menlo,monospace;resize:vertical;-webkit-user-select:text;user-select:text}
input[type=color]{width:56px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:3px}
.colors{display:flex;gap:16px;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{background:none;border:0;border-radius:7px;padding:8px 11px;font:700 13px/1 var(--body);color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--fg);color:#0B0E14}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.note{color:var(--mute);font-size:13px;line-height:1.5;max-width:68ch;margin:0}
.list{display:flex;flex-direction:column}
.lrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;align-items:center}
.lrow:last-child{border-bottom:0}
.lrow .l{display:flex;gap:8px;align-items:center;min-width:0}
.lrow .l span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank{font:800 13px var(--disp);color:var(--mute);width:22px;text-align:right;flex:none}

/* slots + team picker */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:150px}
.slot.empty{align-items:center;justify-content:center;border-style:dashed;color:var(--mute)}
.slot .top{display:flex;gap:12px;align-items:center}
.slot .top b{font-family:var(--disp);font-weight:900;font-style:var(--dstyle);font-size:18px;line-height:1.1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:700 12.5px var(--body);color:var(--mute)}
.chipbtn[aria-pressed="true"]{background:var(--fg);color:#0B0E14;border-color:var(--fg)}
.teampick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;position:relative;overflow:hidden}
.tp::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c1)}
.tp .meta{min-width:0;display:flex;flex-direction:column;gap:3px}
.tp b{font-family:var(--disp);font-weight:var(--dw);font-style:var(--dstyle);font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp small{color:var(--mute);font-size:11.5px}
.tp .ovr{font:900 22px/1 var(--disp);font-style:var(--dstyle);text-align:right}
.tp .ovr small{display:block;font:700 9.5px var(--body);letter-spacing:.08em}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:72px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:12px}
.bar span:first-child{color:var(--mute);text-transform:uppercase;font-weight:700;letter-spacing:.05em;font-size:11px}

/* drive ticker */
.dc-team{display:flex;align-items:center;gap:12px}
.dc-team b{font-family:var(--disp);font-weight:900;font-style:var(--dstyle);font-size:20px;line-height:1.1}
.ticker{display:flex;flex-direction:column;gap:2px;max-height:min(38vh,280px);overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px;background:rgba(0,0,0,.25)}
.tick{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:6px 6px;border-radius:8px;font-size:13px;animation:tin .25s ease}
.tick .dd{font:700 11px/1.3 var(--body);color:var(--mute);text-transform:uppercase}
.tick.good{background:color-mix(in srgb,var(--ok) 12%,transparent)}
.tick.bad{background:color-mix(in srgb,var(--hot) 12%,transparent)}
.tick.big{font-weight:800}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dc-res{font-family:var(--disp);font-weight:900;font-style:var(--dstyle);font-size:clamp(32px,9vw,54px);line-height:1;text-transform:uppercase;color:var(--c)}
.dchips{display:flex;gap:7px;flex-wrap:wrap}
.dchips span{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:800 13px/1 var(--disp);font-variant-numeric:tabular-nums}
.dchips em{font-style:normal;color:var(--mute);margin-right:6px;font:700 10.5px var(--body);text-transform:uppercase}
.track{position:relative;height:24px;border-radius:6px;background:repeating-linear-gradient(90deg,#2E7D32 0 10%,#2a7330 10% 20%);overflow:hidden;border:1px solid var(--line)}
.track .fill{position:absolute;top:8px;height:8px;border-radius:4px;background:var(--c);box-shadow:0 0 10px var(--c);transition:left 1s ease,width 1s ease}
.track .ez{position:absolute;top:0;bottom:0;width:6%}
.scoreline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.scoreline div{display:flex;flex-direction:column;gap:3px}
.scoreline div:last-child{text-align:right}
.scoreline small{font:800 12px/1 var(--disp);color:var(--mute)}
.scoreline strong{font:900 44px/1 var(--disp);font-style:var(--dstyle)}
.scoreline .mid{font:700 13px var(--body);color:var(--mute)}

/* post-game */
.final{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.final .side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.final strong{font:900 56px/1 var(--disp);font-style:var(--dstyle);font-variant-numeric:tabular-nums}
.final small{color:var(--mute);font-size:12px}
.result{font-family:var(--disp);font-weight:900;font-style:var(--dstyle);font-size:clamp(30px,8vw,48px);line-height:1;text-align:center;text-transform:uppercase}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.kpis div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.kpis em{display:block;font:700 10px/1.2 var(--body);font-style:normal;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.kpis b{font:900 22px/1 var(--disp);font-style:var(--dstyle);font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;align-items:stretch}
.heat .lab{font:700 10px/1.2 var(--body);color:var(--mute);text-transform:uppercase;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;text-align:right}
.heat .col{font:700 10px/1 var(--body);color:var(--mute);text-align:center;text-transform:uppercase;padding-bottom:2px}
.heat .cell{border-radius:6px;padding:9px 4px;text-align:center;border:1px solid var(--line);background:rgba(255,255,255,.03);min-height:50px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.heat .cell b{font:900 15px/1 var(--disp)}
.heat .cell small{font-size:11px;opacity:.85}
.heat .losl{grid-column:2/5;height:3px;background:var(--los);border-radius:2px;box-shadow:0 0 8px var(--los)}
.legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mute)}
.legend i{width:80px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--hot),#E6B33C,var(--ok))}
.stamrow{display:grid;grid-template-columns:minmax(0,1fr) 110px 40px;gap:10px;align-items:center;font-size:13px}
.stamrow span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.storm{background:linear-gradient(90deg,var(--team),var(--gold),var(--team));color:#111;border-radius:12px;padding:12px 14px;font:900 18px/1.1 var(--disp);font-style:var(--dstyle);text-transform:uppercase;text-align:center;animation:pulse 1s ease infinite alternate}
@keyframes pulse{to{filter:brightness(1.2)}}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;overflow-x:auto}
.bracket .col{display:flex;flex-direction:column;gap:8px;justify-content:space-around}
.bm{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px;display:flex;flex-direction:column;gap:3px}
.bm .t{display:flex;justify-content:space-between;gap:6px}
.bm .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm .w{font-weight:800}
.bm .me{color:var(--gold)}
@media (max-width:540px){#pauseBtn{top:calc(env(safe-area-inset-top,0px) + 84px)}#toBtn{top:calc(env(safe-area-inset-top,0px) + 84px)}#sb{max-width:calc(100% - 16px)}#toast{top:calc(env(safe-area-inset-top,0px) + 132px)}#flag{top:calc(env(safe-area-inset-top,0px) + 170px)}.hub-top .who b{font-size:16px;white-space:normal}.hub-top{gap:8px;flex-wrap:wrap}.badge.lg{--s:48px}.tick{grid-template-columns:78px minmax(0,1fr)}}
@media (max-width:420px){.sb-main{height:38px}.tm .sc{font-size:21px}.tm{gap:5px;padding-right:7px}.clk{padding:0 7px;font-size:15px}.pc{min-width:30px;padding:0 5px;font-size:12px}.tm .rk,.tm .tos{display:none}.sb-sub span{padding:5px 9px}#wxs{display:none}}
@media (max-height:480px){.sheet{padding-top:10px;gap:6px}.play{padding:7px 11px}.play b{font-size:16px}.play small{display:none}.sheet h3{font-size:11px}.hub-top{padding-top:calc(env(safe-area-inset-top,0px) + 6px);padding-bottom:6px}.badge.lg{--s:42px}#kcv{width:min(300px,60vw)}#bulletBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 44px)}}
@media (prefers-reduced-motion:reduce){#banner.on .strip{animation-duration:.01s}.tm .sc.bump,.storm{animation:none}}
</style>

<body>
<div id="app">
  <canvas id="field" aria-label="Football field"></canvas>

  <header id="sb" hidden>
    <div class="sb-main">
      <div class="tm" id="tmH"><i class="chip"></i><span class="rk"></span><b class="ab">AAA</b><span class="tos"></span><span class="pos"></span><b class="sc">0</b></div>
      <div class="tm" id="tmA"><i class="chip"></i><span class="rk"></span><b class="ab">BBB</b><span class="tos"></span><span class="pos"></span><b class="sc">0</b></div>
      <div class="clk"><span id="qtr">1ST</span><span id="gclk">3:00</span></div>
      <div class="pc" id="pclk">:25</div>
    </div>
    <div class="sb-sub"><span id="dd">1st &amp; 10</span><span id="spot">25</span><span id="stam">100%</span><span id="wxs">Clear</span></div>
  </header>
  <button class="ibtn" id="pauseBtn" aria-label="Pause" hidden><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  <button class="ibtn" id="toBtn" aria-label="Call timeout" hidden>TIMEOUT</button>
  <button id="bulletBtn" aria-pressed="false" hidden>Bullet</button>
  <div id="toast"></div>
  <div id="flag"></div>
  <div id="banner"><div class="strip"><span></span></div></div>
  <div id="hint" hidden></div>

  <section id="call" class="sheet" hidden><h3 id="callHead"></h3><div class="row" id="callRow"></div></section>
  <section id="opt" class="sheet" hidden><h3 id="optHead"></h3><div class="row" id="optRow"></div></section>
  <section id="kick" class="sheet" hidden>
    <h3 id="kickHead">Field goal</h3>
    <canvas id="kcv" width="840" height="472"></canvas>
    <button class="btn" id="kickBtn">Tap to aim</button>
  </section>

  <section id="card" class="modal" hidden>
    <div class="panel">
      <div class="eyebrow" id="dcEye"></div>
      <div class="dc-team" id="dcTeam"></div>
      <div class="ticker" id="dcTicker"></div>
      <div class="dc-res" id="dcRes" hidden></div>
      <div class="dchips" id="dcChips"></div>
      <div class="track" id="dcTrack"><div class="ez" style="left:0"></div><div class="ez" style="right:0"></div><div class="fill"></div></div>
      <div class="scoreline" id="dcScore"></div>
      <button class="btn light wide" id="dcGo">Skip</button>
    </div>
  </section>

  <section id="pausem" class="modal" hidden>
    <div class="panel">
      <div class="eyebrow">Timeout on the field</div>
      <div class="h1">Paused</div>
      <p class="note">Your game is saved at every snap, so you can close the app and resume later. Sim to final plays out the rest of the game instantly, based on both rosters and the current score.</p>
      <div class="btns"><button class="btn light" id="resume">Resume</button><button class="btn ghost" id="simRest">Sim to final</button><button class="btn ghost" id="quitHub">Save &amp; exit</button></div>
    </div>
  </section>

  <section id="post" class="screen" hidden><div class="scroll"><div class="wrap" id="postBody"></div></div></section>
  <section id="hub" class="screen" hidden>
    <div class="hub-top" id="hubTop"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="scroll" id="hubScroll"><div class="wrap" id="hubBody"></div></div>
  </section>
  <section id="setup" class="screen" hidden><div class="scroll" style="padding-top:calc(env(safe-area-inset-top,0px) + 16px)"><div class="wrap" id="setupBody"></div></div></section>
  <section id="modal" class="modal" hidden><div class="panel" id="modalBody"></div></section>
</div>

/* =========================================================
   01 · Utilities, storage, save slots
   ========================================================= */
const VERSION=3;
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.random()*(b-a), rint=(a,b)=>Math.floor(R(a,b+1)), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)], hyp=Math.hypot, lerp=(a,b,t)=>a+(b-a)*t;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((s,x)=>s+x,0);
let UID=1;const uid=()=>++UID;
function lum(hex){const n=parseInt(String(hex).slice(1),16)||0,r=(n>>16)/255,g=(n>>8&255)/255,b=(n&255)/255;return .2126*r+.7152*g+.0722*b}
const inkOn=c=>lum(c)>.55?'#0B0E14':'#FFFFFF';
const contrasty=(a,b)=>Math.abs(lum(a)-lum(b))>.25;
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=f<0?0:255,p=Math.abs(f);r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
const starStr=n=>{n=clamp(Math.round(n),0,5);return `<span class="stars" aria-label="${n} of 5 stars">${'★'.repeat(n)}<i>${'★'.repeat(5-n)}</i></span>`};
const ordn=n=>n+(['th','st','nd','rd'][((n%100)-20)%10]||['th','st','nd','rd'][n%100]||'th');
const money=k=>k>=1000?`$${(k/1000).toFixed(k%1000?2:0)}M`:`$${Math.round(k)}K`;
const pct=x=>Math.round(x*100)+'%';
const meterHTML=(v,col)=>`<div class="meter"><i style="width:${clamp(v,0,100)}%;background:${col||(v>66?'var(--ok)':v>33?'var(--warn)':'var(--hot)')}"></i></div>`;

/* Key-value storage: the iOS app bridges to UserDefaults; browsers use localStorage */
const KV={
  get(k){

const SLOTS=[1,2,3];
const pack=obj=>'Z:'+LZString.compressToBase64(JSON.stringify(obj));
const unpack=raw=>{if(!raw)return null;if(raw.startsWith('Z:'))return JSON.parse(LZString.decompressFromBase64(raw.slice(2)));return JSON.parse(raw)};

  meta(){try{return JSON.parse(KV.get('gl3.meta'))||{slots:{},last:null}}catch(e){return {slots:{},last:null}}},
  writeMeta(m){KV.set('gl3.meta',JSON.stringify(m))},
  load(slot){
    try{const L=migrate(unpack(KV.get('gl3.slot'+slot)));if(!L)return null;let live=null;try{live=JSON.parse(KV.get('gl3.live'+slot)||'null')}catch(e){}L.live=live&&live.wk===L.week&&L.phase==='regular'?live:null;return L}
    catch(e){console.error(e);return null}
  },

    if(!slot||!L)return;
    try{const live=L.live;L.live=null;const raw=pack(L);L.live=live;KV.set('gl3.slot'+slot,raw);KV.set('gl3.live'+slot,live?JSON.stringify(live):null)}catch(e){console.error(e);try{toast('Could not save. Storage may be full.')}catch(_){}}
    this.touch(slot,L);
  },
  saveLive(slot,L){if(!slot||!L)return;KV.set('gl3.live'+slot,L.live?JSON.stringify(L.live):null);this.touch(slot,L)},
  touch(slot,L){const m=this.meta(),u=L.teams[L.user];
    m.slots[slot]={name:L.name,coach:L.coach.name,team:teamName(u),abbr:u.abbr,c1:u.c1,c2:u.c2,season:L.season,label:weekLabel(L),rec:`${u.rec.w}–${u.rec.l}`,updated:Date.now(),live:!!L.live,titles:L.coach.natties,div:u.div};

/* Older saves (v1) are carried into slot 1 on first launch */
function importLegacy(){
  const m=Saves.meta();if(Object.keys(m.slots).length)return;
  let raw=null;
  try{if(typeof window.__NATIVE_SAVE__==='string'&&window.__NATIVE_SAVE__)raw=window.__NATIVE_SAVE__}catch(e){}
  if(!raw){try{raw=localStorage.getItem('gridiron-live-dynasty-v1')}catch(e){}}
  if(!raw)return;
  try{const L=migrate(JSON.parse(raw));if(L){Saves.save(1,L)}}catch(e){console.error(e)}
}
function bumpUID(L){for(const t of L.teams)for(const p of t.roster)UID=Math.max(UID,p.id||0);for(const k of ['recruits','portal'])if(L.off&&L.off[k])for(const p of L.off[k])UID=Math.max(UID,p.id||0)}
const timeAgo=ts=>{const s=(Date.now()-ts)/1000;if(s<60)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' hr ago';return Math.round(s/86400)+' days ago'};

/* =========================================================
   02 · League data: schools, players, ratings, staff
   ========================================================= */

}

function genLeague(name){

/* ---------- save migration ---------- */
function migrate(L){
  if(!L||!L.teams)return null;
  if(L.version===VERSION)return L;
  if(L.version!==1)return null;
  for(const t of L.teams){
    for(const p of t.roster){p.str=p.str||clamp(Math.round((p.spd+p.end)/2+R(-1,1)),1,5);p.acc=p.acc||clamp(Math.round(p.thr+R(-1,1)),1,5);p.tkl=p.tkl||clamp(Math.round(p.cat+R(-1,1)),1,5);
      Object.assign(p,{cond:100,inj:0,injWhy:'',xp:0,ss:newSS(),rs:false,redshirt:false,home:pick(PLACES)})}
    for(const pos of POS_ORDER){let have=t.roster.filter(p=>p.pos===pos).length;while(have<POS_COUNTS[pos]){t.roster.push(genPlayer(pos,1.6+t.prestige*.5));have++}}
    assignNumbers(t);Object.assign(t,{div:'FBS',stadium:t.city+' Stadium',cap:(30+t.prestige*14)*1000,bowlWins:0,playoffApps:0,dco:null,cc:false});
  }
  const fresh=genLeague(L.name);
  Object.assign(fresh,{teams:L.teams,user:L.user,credits:L.credits||8,season:L.season,history:(L.history||[]).map(h=>({...h})),settings:{...fresh.settings,...(L.settings||{}),style:'modern'}});
  for(const t of fresh.teams){t.rival=null}
  for(let c=0;c<4;c+=2){const A=fresh.teams.filter(t=>t.conf===c),B=fresh.teams.filter(t=>t.conf===c+1);A.forEach((x,j)=>setRival(x,B[j],'The '+pick(TROPHY_A)+' '+pick(TROPHY_B)))}
  fresh.coach.name='Coach';fresh.coach.schools=[fresh.user];
  finishLeague(fresh);
  fresh.news.unshift({t:'Your dynasty was carried over to the new version. The current season restarts with the new college calendar.'});
  return fresh;
}

function applyTeamPack(L,pack,opts){
  const list=Array.isArray(pack)?pack:pack&&pack.teams;if(!Array.isArray(list)||!list.length)throw new Error('not a pack');
  if(!Array.isArray(pack)&&Array.isArray(pack.conferences))pack.conferences.forEach((n,i)=>{if(L.confs[i])L.confs[i].name=String(n).slice(0,22)});
  const hex=/^#[0-9a-f]{6}$/i;
  list.slice(0,L.teams.length).forEach((e,i)=>{const t=L.teams[i];if(!t||!e)return;
    if(e.school)t.city=String(e.school).slice(0,24);if(e.mascot)t.name=String(e.mascot).slice(0,18);if(e.abbr)t.abbr=String(e.abbr).toUpperCase().slice(0,5);
    if(hex.test(e.primary||''))t.c1=e.primary;if(hex.test(e.secondary||''))t.c2=e.secondary;if(e.stadium)t.stadium=String(e.stadium).slice(0,34);
    const pr=parseInt(e.prestige);if(pr>=1&&pr<=5&&pr!==t.prestige){t.prestige=pr;t.q=1.1+pr*.62;
      if(opts&&opts.regen&&t.id!==L.user){t.roster=[];for(const pos of POS_ORDER)for(let k=0;k<POS_COUNTS[pos];k++)t.roster.push(genPlayer(pos,qOf(t)));assignNumbers(t)}}
    if(Array.isArray(e.roster)&&e.roster.length)t.roster=rosterFromPack(e.roster,t);
    t.dco=null;});
  invalidate();if(L.phase==='regular'&&L.week===0){resetRecords(L);buildSchedule(L)}updateRankings(L);
}

   Missing ratings are generated around the player's overall; open spots are filled with walk-ons. */
function rosterFromPack(list,t){
  const out=[];const posMap={OT:'OL',OG:'OL',IOL:'OL',C:'OL',G:'OL',T:'OL',DE:'DL',DT:'DL',EDGE:'DL',NT:'DL',OLB:'LB',ILB:'LB',MLB:'LB',DB:'CB',FS:'S',SS:'S',SAF:'S',PK:'K',P:'K',HB:'RB',FB:'RB',ATH:'WR'};
  for(const e of list.slice(0,ROSTER_CAP)){if(!e||!e.name)continue;let pos=String(e.pos||'').toUpperCase();pos=POS_ORDER.includes(pos)?pos:posMap[pos];if(!pos)continue;
    const q=parseFloat(e.ovr);const p=genPlayer(pos,q>=1&&q<=5?q:qOf(t));const nm=String(e.name).trim().split(/\s+/);p.first=nm.shift().slice(0,16);p.last=(nm.join(' ')||'').slice(0,20);
    const yr=typeof e.yr==='string'?['FR','SO','JR','SR'].indexOf(e.yr.toUpperCase().replace(/^RS\s*/,''))+1:parseInt(e.yr);if(yr>=1&&yr<=4)p.yr=yr;if(/^RS/i.test(String(e.yr||'')))p.rs=true;
    const n=parseInt(e.num);if(n>=0&&n<=99)p.num=n;for(const k of ATTR_KEYS){const v=parseInt(e[k]);if(v>=1&&v<=5)p[k]=v}out.push(p)}
  for(const pos of POS_ORDER){let have=out.filter(p=>p.pos===pos).length;while(have<POS_COUNTS[pos]){out.push(genPlayer(pos,qOf(t)-.5));have++}}
  assignNumbers({roster:out});return out;
}

function genNCAALeague(name){
  const teams=[],confs=[];let id=0;
  NCAA.forEach((c,ci)=>{confs.push({name:c.name,div:c.div,cg:c.cg,ccg:!!c.ccg,ind:!!c.ind,auto:c.div==='FCS'?!!c.auto:true,celebration:!!c.celebration});
    for(const line of c.t.split('\n')){const [school,mascot,abbr,c1,c2,r]=line.split('|');const q=parseFloat(r);const prestige=clamp(Math.round(q),1,5);
      teams.push(genTeam(id++,school,mascot,c1,prestige,ci,{exact:true,abbr,c2,div:c.div,q,stadium:school+' Stadium'}))}});
  const L=baseLeague(name,teams,confs);L.kind='ncaa';
  const by={};for(const t of teams)by[t.abbr]=t;
  for(const [a,b,tr] of NCAA_RIVALS){const x=by[a],y=by[b];if(x&&y&&x.rival==null&&y.rival==null)setRival(x,y,tr)}
  return finishLeague(L);
}

function weekLabel(L){if(L.phase==='offseason')return 'Offseason';const w=L.weeks[L.week];return w?w.label:'Season complete'}
function weatherFor(i){const r=Math.random();if(i>=8&&r<.13)return 'Snow';if(r<.2)return 'Rain';if(r<.32)return 'Wind';return 'Clear'}
const WX_ICON={Clear:'☀︎',Rain:'☂︎',Snow:'❄︎',Wind:'⚑'};
const isInd=(L,t)=>!!(L.confs[t.conf]&&L.confs[t.conf].ind);

/* General scheduler: rivalry games, conference games (circulant graph per conference so every
   team gets the same number), non-conference fill to 12 games, then weeks by greedy edge colouring. */
function buildSchedule(L){
  const TT=L.teams,n=TT.length,games=[],played=new Set(),deg=new Array(n).fill(0);
  const key=(a,b)=>a<b?a+'-'+b:b+'-'+a;
  const addG=(a,b,extra)=>{const h=Math.random()<.5?a:b;const g=Object.assign({h,a:h===a?b:a},extra||{});games.push(g);played.add(key(a,b));deg[a]++;deg[b]++;return g};
  const rivalGames=[];
  for(const t of TT)if(t.rival!=null&&t.id<t.rival&&TT[t.rival]&&TT[t.rival].rival===t.id)rivalGames.push(addG(t.id,t.rival,{rival:true,tag:t.trophy}));
  L.confs.forEach((c,ci)=>{if(c.ind)return;const ids=shuffle(TT.filter(t=>t.conf===ci).map(t=>t.id)),m=ids.length;if(m<2)return;
    const ord=[],used=new Set();for(const id of ids){if(used.has(id))continue;ord.push(id);used.add(id);const r=TT[id].rival;if(r!=null&&ids.includes(r)&&!used.has(r)){ord.push(r);used.add(r)}}
    const d=Math.min(c.cg,m-1),h=Math.floor(d/2);
    for(let i=0;i<m;i++)for(let j=i+1;j<m;j++){const dist=Math.min(j-i,m-(j-i));const want=d>=m-1||(dist<=h)||(d%2===1&&m%2===0&&dist===m/2);if(want&&!played.has(key(ord[i],ord[j])))addG(ord[i],ord[j])}});
  const TARGET=12;
  for(let pass=0;pass<4;pass++){
    const need=shuffle(TT.filter(t=>deg[t.id]<TARGET).map(t=>t.id));
    for(const a of need){
      while(deg[a]<TARGET){const ta=TT[a];
        let c=need.filter(b=>b!==a&&deg[b]<TARGET&&(pass>=3||TT[b].conf!==ta.conf||isInd(L,ta))&&!played.has(key(a,b)));
        if(!c.length)break;
        const same=c.filter(b=>TT[b].div===ta.div);const pool=same.length&&Math.random()<.86?same:c;addG(a,pick(pool));
      }
    }
  }
  let R=13,assign=null;
  for(let attempt=0;attempt<30;attempt++){
    if(attempt===12)R=14;
    const busy=Array.from({length:n},()=>new Set()),as=new Map();let fail=0;
    for(const g of rivalGames){busy[g.h].add(R-1);busy[g.a].add(R-1);as.set(g,R-1)}
    const rg=new Set(rivalGames);
    const others=shuffle(games.filter(g=>!rg.has(g))).sort((x,y)=>(TT[x.h].conf===TT[x.a].conf)-(TT[y.h].conf===TT[y.a].conf));
    for(const g of others){const conf=TT[g.h].conf===TT[g.a].conf;let w=-1;
      if(conf){for(let k=R-2;k>=0;k--)if(!busy[g.h].has(k)&&!busy[g.a].has(k)){w=k;break}}
      else{for(let k=0;k<R-1;k++)if(!busy[g.h].has(k)&&!busy[g.a].has(k)){w=k;break}}
      if(w<0){fail++;continue}busy[g.h].add(w);busy[g.a].add(w);as.set(g,w)}
    assign=as;if(!fail)break;
  }
  L.R=R;
  L.weeks=Array.from({length:R},(_,i)=>({label:i===R-1?'Rivalry Week':'Week '+(i+1),kind:'reg',games:[]}));
  for(const [g,w] of assign)L.weeks[w].games.push({h:g.h,a:g.a,hs:null,as:null,wx:weatherFor(w),slot:pick(['Noon','Afternoon','Afternoon','Primetime']),tag:g.rival?g.tag:null,rival:!!g.rival});
  L.cfp=null;L.fcsp=null;L.champ=null;L.champF=null;
  if(L.user!=null)setHomecoming(L);
}
function setHomecoming(L){const ws=[];L.weeks.forEach((w,i)=>{if(i>=1&&i<L.R-3&&w.games.some(g=>g.h===L.user))ws.push(i)});L.hcWeek=ws.length?pick(ws):null}
function seniorDayWeek(L){let last=null;L.weeks.forEach((w,i)=>{if(w.kind==='reg'&&w.games.some(g=>g.h===L.user))last=i});return last}
const isConfGame=g=>{const a=T(g.h),b=T(g.a);return a.conf===b.conf&&!g.post&&!isInd(LG,a)};
function gameFlags(L,g,wi){
  const f=[];const u=L.user;const home=g.h===u&&!g.neutral;
  if(g.rival)f.push(['gold','Rivalry · '+g.tag]);
  else if(g.tag)f.push(['gold',g.tag]);
  if(home&&wi===L.hcWeek)f.push(['blue','Homecoming']);
  if(home&&wi===seniorDayWeek(L)&&L.weeks[wi].kind==='reg')f.push(['blue','Senior Day']);
  if(!g.post&&isConfGame(g))f.push(['','Conference game']);
  if(!g.post&&T(g.h).div!==T(g.a).div)f.push(['','FBS vs FCS']);
  if(g.slot==='Primetime')f.push(['hot','Primetime']);
  return f;
}

/* ---------- CPU sims + player stat lines ---------- */
function simScore(h,a,neutral){
  const rh=teamOvr(T(h)),ra=teamOvr(T(a));const edge=neutral?0:2.5;const m=(rh-ra)*9+edge;
  const pts=x=>{x=Math.max(0,x);const td=Math.max(0,Math.round(x/7*.85+R(-.6,.6)));const fg=Math.max(0,Math.round((x-td*7)/3));return td*7+fg*3};
  let hs=pts(24+m/2+R(-11,11)),as=pts(24-m/2+R(-11,11));
  if(hs===as){if(Math.random()<.5+m/40)hs+=pick([3,6,7,8]);else as+=pick([3,6,7,8])}
  return [hs,as];
}
function simStats(t,pts){
  const qb=starters(t,'QB')[0],rb=starters(t,'RB')[0],wr=starters(t,'WR'),te=starters(t,'TE')[0],k=starters(t,'K')[0];
  if(!qb||!rb)return;
  const tds=Math.floor(pts/7),ptd=Math.round(tds*R(.45,.7)),rtd=Math.max(0,tds-ptd);
  const py=Math.max(60,Math.round(R(110,190)+pts*4+(qb.thr+qb.acc-6)*18)),att=Math.round(py/R(6.5,9));
  Object.assign(qb.ss,{gp:qb.ss.gp+1,pa:qb.ss.pa+att,pc:qb.ss.pc+Math.round(att*R(.52,.72)),py:qb.ss.py+py,ptd:qb.ss.ptd+ptd,int:qb.ss.int+(Math.random()<.45?rint(1,2):0)});
  const ry=Math.round(R(50,150)+(rb.spd+rb.str-6)*12);rb.ss.gp++;rb.ss.ra+=Math.round(ry/R(3.8,5.6));rb.ss.ry+=ry;rb.ss.rtd+=rtd;
  const recs=[...wr,te].filter(Boolean),sh=[.36,.26,.18,.2];
  recs.forEach((r,i)=>{r.ss.gp++;const y=Math.round(py*sh[i]*R(.7,1.3));r.ss.recy+=y;r.ss.rec+=Math.max(0,Math.round(y/R(9,15)))});
  for(let i=0;i<ptd;i++){const r=recs[Math.min(recs.length-1,Math.floor(Math.random()**1.4*recs.length))];r.ss.rectd++}
  for(const p of starters(t,'LB'))p.ss.tkl+=rint(4,9);for(const p of starters(t,'S'))p.ss.tkl+=rint(2,6);for(const p of starters(t,'CB'))p.ss.tkl+=rint(1,4);
  for(const p of starters(t,'DL')){p.ss.tkl+=rint(1,4);if(Math.random()<.22)p.ss.sck++}
  if(Math.random()<.35){const db=pick([...starters(t,'CB'),...starters(t,'S')]);if(db)db.ss.dint++}
  if(k){const fga=Math.round((pts%7)/3)+(Math.random()<.3?1:0);k.ss.fga+=fga;k.ss.fgm+=Math.max(0,fga-(Math.random()<.25?1:0))}
  for(const p of [...starters(t,'OL'),...starters(t,'DL')])p.ss.gp++;
}
function recordGame(L,g){
  const H=L.teams[g.h],A=L.teams[g.a];const conf=!g.post&&H.conf===A.conf&&!isInd(L,H);
  H.rec.pf+=g.hs;H.rec.pa+=g.as;A.rec.pf+=g.as;A.rec.pa+=g.hs;
  if(g.hs>g.as){H.rec.w++;A.rec.l++;if(conf){H.rec.cw++;A.rec.cl++}}else{A.rec.w++;H.rec.l++;if(conf){A.rec.cw++;H.rec.cl++}}
}
const winner=g=>g.hs>g.as?g.h:g.a, loser=g=>g.hs>g.as?g.a:g.h;

/* ---------- polls (FBS and FCS ranked separately) ---------- */
function updateRankings(L){
  const winp=t=>{const g=t.rec.w+t.rec.l;return g?t.rec.w/g:.5};
  const opps={};L.teams.forEach(t=>opps[t.id]=[]);
  for(const w of L.weeks)for(const g of w.games)if(g.hs!=null){opps[g.h].push(g.a);opps[g.a].push(g.h)}
  const sos=t=>{const o=opps[t.id];return o.length?o.reduce((s,id)=>{const ot=L.teams[id];return s+winp(ot)*(ot.div!==t.div&&ot.div==='FCS'?.4:1)},0)/o.length:.5};
  const sc={};for(const t of L.teams)sc[t.id]=winp(t)*60+(teamOvr(t)-1)*5+t.prestige*2.2-t.rec.l*3.5+sos(t)*14+(t.cc?6:0)+Math.random()*.01;
  const ids=L.teams.map(t=>t.id).sort((a,b)=>sc[b]-sc[a]);
  L.rank=ids.filter(id=>!isFCS(L.teams[id]));L.rankF=ids.filter(id=>isFCS(L.teams[id]));
}
const rankList=(L,t)=>isFCS(t)?(L.rankF||[]):L.rank;
const rankOf=id=>{const t=LG.teams[id];const i=rankList(LG,t).indexOf(id);return i>=0&&i<25?i+1:null};
const rankTag=id=>{const r=rankOf(id);return r?`#${r} `:''};
const pollName=(L,div)=>div==='FCS'?(L.phase==='offseason'?'FCS final poll':'FCS poll'):L.phase==='offseason'?'Final poll':L.week===0?'Preseason poll':L.week>=L.R-5?'CFP rankings':'Media poll';
function h2h(L,a,b){for(const w of L.weeks)for(const g of w.games)if(g.hs!=null&&!g.post&&((g.h===a&&g.a===b)||(g.h===b&&g.a===a)))return winner(g)===a?-1:1;return 0}
function confStandings(L,c){
  const ri=id=>{const t=L.teams[id];const i=rankList(L,t).indexOf(id);return i<0?999:i};
  return L.teams.filter(t=>t.conf===c).sort((a,b)=>(b.rec.cw-b.rec.cl)-(a.rec.cw-a.rec.cl)||h2h(L,a.id,b.id)||(b.rec.w-b.rec.l)-(a.rec.w-a.rec.l)||ri(a.id)-ri(b.id));
}

/* ---------- postseason: title games, 12-team CFP, bowls, 24-team FCS playoff, Celebration Bowl ---------- */
function postGame(h,a,extra){return Object.assign({h,a,hs:null,as:null,post:true,neutral:true,wx:'Clear',slot:'Primetime'},extra)}
const WIN=g=>g&&g.hs!=null?winner(g):null;
function buildPost(L){
  const k=L.week-L.R,cs=L.confs.map((c,i)=>[c,i]),games=[];
  if(k===0){
    for(const [c,i] of cs)if(c.ccg&&!c.ind){const s=confStandings(L,i);if(s.length>=2)games.push(postGame(s[0].id,s[1].id,{tag:c.name+' Championship',ccg:true,conf:i}))}
    for(const [c,i] of cs)if(c.div==='FCS'&&!c.ccg&&!c.ind){const s=confStandings(L,i);if(s[0]){s[0].cc=true;s[0].ccTitles++}}
    const fcs=L.teams.filter(isFCS);
    if(fcs.length>=16){
      const field=fcs.filter(t=>t.cc&&L.confs[t.conf].auto).map(t=>t.id);
      for(const id of L.rankF){if(field.length>=24)break;const t=L.teams[id];if(!field.includes(id)&&!L.confs[t.conf].celebration)field.push(id)}
      const seeds=field.sort((a,b)=>L.rankF.indexOf(a)-L.rankF.indexOf(b));
      L.fcsp={seeds,r1:[],r2:[],qf:[],sf:[],final:null};for(const id of seeds)L.teams[id].playoffApps++;
      for(let j=0;j<8;j++){const hi=seeds[8+j],lo=seeds[23-j];if(hi==null||lo==null){L.fcsp.r1.push(null);continue}const g=postGame(hi,lo,{fcsp:true,neutral:false,tag:`FCS Playoffs · First Round · #${9+j} vs #${24-j}`,wx:weatherFor(12),slot:'Afternoon'});L.fcsp.r1.push(g);games.push(g)}
    }
    L.weeks[L.week]={label:WEEK_NAMES[0],kind:'post0',games};
  }
  if(k===1){
    const champs=L.teams.filter(t=>!isFCS(t)&&t.cc).map(t=>t.id).sort((a,b)=>L.rank.indexOf(a)-L.rank.indexOf(b));
    const field=champs.slice(0,5);for(const id of L.rank){if(field.length>=12)break;if(!field.includes(id))field.push(id)}
    const seeds=field.sort((a,b)=>L.rank.indexOf(a)-L.rank.indexOf(b));
    L.cfp={seeds,r1:[],qf:[],sf:[],final:null};for(const id of seeds)L.teams[id].playoffApps++;
    for(let j=0;j<4;j++){const g=postGame(seeds[4+j],seeds[11-j],{cfp:true,neutral:false,tag:`CFP First Round · #${5+j} vs #${12-j}`,wx:weatherFor(13)});L.cfp.r1.push(g);games.push(g)}
    const elig=L.rank.filter(id=>!seeds.includes(id)&&L.teams[id].rec.w>=6),names=shuffle(BOWLS.slice());
    for(let j=0;j+1<elig.length&&j/2<names.length;j+=2)games.push(postGame(elig[j],elig[j+1],{bowl:true,tag:names[j/2]}));
    const cel=cs.filter(([c])=>c.celebration).map(([c,i])=>L.teams.find(t=>t.conf===i&&t.cc)||confStandings(L,i)[0]).filter(Boolean);
    if(cel.length===2)games.push(postGame(cel[0].id,cel[1].id,{bowl:true,tag:'Celebration Bowl'}));
    if(L.fcsp){const s=L.fcsp.seeds;for(let sd=1;sd<=8;sd++){const opp=WIN(L.fcsp.r1[8-sd]);if(s[sd-1]==null||opp==null){L.fcsp.r2.push(null);continue}const g=postGame(s[sd-1],opp,{fcsp:true,neutral:false,tag:`FCS Playoffs · Second Round · #${sd} seed`,slot:'Afternoon'});L.fcsp.r2.push(g);games.push(g)}}
    L.weeks[L.week]={label:WEEK_NAMES[1],kind:'post1',games};
  }
  if(k===2){
    const s=L.cfp.seeds,r=L.cfp.r1.map(WIN);L.cfp.qf=[[s[0],r[3]],[s[1],r[2]],[s[2],r[1]],[s[3],r[0]]].map(([a,b],j)=>postGame(a,b,{cfp:true,tag:`CFP Quarterfinal · ${CFP_QF[j]}`}));games.push(...L.cfp.qf);
    if(L.fcsp){const r2=L.fcsp.r2.map(WIN);L.fcsp.qf=[[0,7],[1,6],[2,5],[3,4]].map(([a,b])=>r2[a]!=null&&r2[b]!=null?postGame(r2[a],r2[b],{fcsp:true,neutral:false,tag:'FCS Playoffs · Quarterfinal',slot:'Afternoon'}):null);games.push(...L.fcsp.qf.filter(Boolean))}
    L.weeks[L.week]={label:WEEK_NAMES[2],kind:'post2',games};
  }
  if(k===3){
    const q=L.cfp.qf.map(WIN);L.cfp.sf=[postGame(q[0],q[3],{cfp:true,tag:'CFP Semifinal · '+CFP_SF[0]}),postGame(q[1],q[2],{cfp:true,tag:'CFP Semifinal · '+CFP_SF[1]})];games.push(...L.cfp.sf);
    if(L.fcsp){const f=L.fcsp.qf.map(WIN);L.fcsp.sf=[[0,3],[1,2]].map(([a,b])=>f[a]!=null&&f[b]!=null?postGame(f[a],f[b],{fcsp:true,neutral:false,tag:'FCS Playoffs · Semifinal',slot:'Afternoon'}):null);games.push(...L.fcsp.sf.filter(Boolean))}
    L.weeks[L.week]={label:WEEK_NAMES[3],kind:'post3',games};
  }
  if(k===4){
    const f=L.cfp.sf.map(WIN);L.cfp.final=postGame(f[0],f[1],{cfp:true,tag:'CFP National Championship'});games.push(L.cfp.final);
    if(L.fcsp){const g=L.fcsp.sf.map(WIN);if(g[0]!=null&&g[1]!=null){L.fcsp.final=postGame(g[0],g[1],{fcsp:true,tag:'FCS National Championship'});games.push(L.fcsp.final)}}
    L.weeks[L.week]={label:WEEK_NAMES[4],kind:'post4',games};
  }
}
function userGameThisWeek(){const w=LG.weeks[LG.week];if(!w||LG.phase!=='regular')return null;return w.games.find(g=>(g.h===LG.user||g.a===LG.user)&&g.hs==null)||null}

/* ---------- Heisman + awards ---------- */
function prodScore(p){const s=p.ss;return s.py/25+s.ptd*4-s.int*3+s.ry/10+s.rtd*6+s.recy/11+s.rectd*5+s.tkl*.25+s.sck*3+s.dint*5}
function heismanScore(L,t,p){if(!['QB','RB','WR','TE'].includes(p.pos))return 0;const g=t.rec.w+t.rec.l;const wp=g?t.rec.w/g:.5;return prodScore(p)*(.55+wp*.7)+ovr(p)*4}
function heismanTop(L,n,div){div=div||'FBS';const all=[];for(const t of L.teams){if(t.div!==div)continue;for(const p of t.roster){const s=heismanScore(L,t,p);if(s>0)all.push({p,t,s})}}return all.sort((a,b)=>b.s-a.s).slice(0,n)}
const statLine=p=>{const s=p.ss;if(p.pos==='QB')return `${s.py} pass yds · ${s.ptd} TD · ${s.int} INT`;if(p.pos==='RB')return `${s.ry} rush yds · ${s.rtd} TD`;if(p.pos==='WR'||p.pos==='TE')return `${s.rec} rec · ${s.recy} yds · ${s.rectd} TD`;if(p.pos==='K')return `${s.fgm}/${s.fga} FG`;return `${s.tkl} tackles · ${s.sck} sacks · ${s.dint} INT`};
function awardHeisman(L){
  const f=heismanTop(L,1,'FCS')[0];if(f){L.fcsPoy={season:L.season,name:fullName(f.p),pos:f.p.pos,team:f.t.id,line:statLine(f.p)};if(f.t.id===L.user){L.fan=clamp(L.fan+8,0,100);L.news.unshift({t:`${fullName(f.p)} is named FCS Player of the Year!`,good:true})}}
  const top=heismanTop(L,3);if(!top.length)return;const w=top[0];
  L.heisman={season:L.season,pid:w.p.id,name:fullName(w.p),pos:w.p.pos,team:w.t.id,line:statLine(w.p),finalists:top.map(x=>({name:fullName(x.p),team:x.t.id,pos:x.p.pos}))};
  if(w.t.id===L.user){L.fan=clamp(L.fan+10,0,100);L.morale=clamp(L.morale+8,0,100);L.news.unshift({t:`${fullName(w.p)} wins the Heisman Trophy! Recruits across the country noticed.`,good:true});w.p.heisman=(w.p.heisman||0)+1}
  else L.news.unshift({t:`${fullName(w.p)} (${w.t.city}) wins the Heisman Trophy.`});
}
function computeAwards(L){
  const score=(t,p)=>ovr(p)*10+prodScore(p)*.6;
  const team=(teams,filter)=>{const out=[];for(const pos of POS_ORDER){const c=[];for(const t of teams)for(const p of t.roster)if(p.pos===pos&&(!filter||filter(p)))c.push({p,t,s:score(t,p)});c.sort((a,b)=>b.s-a.s).slice(0,STARTERS[pos]).forEach(x=>out.push({pid:x.p.id,name:fullName(x.p),pos,team:x.t.id}))}return out};
  const u=L.teams[L.user],div=L.teams.filter(t=>t.div===u.div);
  const allAm=team(div),allConf=team(L.teams.filter(t=>t.conf===u.conf)),frosh=team(div,p=>p.yr===1);
  let coy=null,best=-99;for(const t of div){const exp=3.5+t.prestige*1.4;const d=t.rec.w-exp+(t.cc?1:0)+(L.champ===t.id||L.champF===t.id?2:0);if(d>best){best=d;coy=t.id}}
  if(coy===L.user)L.coach.coy++;
  return {allAm,allConf,frosh,coy,heisman:L.heisman};
}

/* ---------- weekly flow ---------- */
function weeklyUpkeep(L){
  const u=L.teams[L.user];const rec=12+6*L.fac.rehab;
  for(const p of u.roster){p.cond=Math.min(100,p.cond+rec);if(p.inj>0){if(p.injNew)p.injNew=false;else{p.inj--;if(p.inj<=0){p.inj=0;p.injWhy=''}}}}
  L.morale=clamp(L.morale+(65-L.morale)*.08+(captainsHealthy(L)?1:0),0,100);
}
const captainsHealthy=L=>L.captains.length>0&&L.captains.every(id=>{const p=L.teams[L.user].roster.find(x=>x.id===id);return p&&p.inj<=0});
function finishWeek(L){
  invalidate();
  const w=L.weeks[L.week];const preF=L.rank.slice(0,25),preC=(L.rankF||[]).slice(0,25);const rk=id=>{const l=isFCS(L.teams[id])?preC:preF;const i=l.indexOf(id);return i>=0?i+1:null};
  for(const g of w.games){
    if(g.hs==null){const [hs,as]=simScore(g.h,g.a,g.neutral);g.hs=hs;g.as=as;recordGame(L,g);simStats(L.teams[g.h],hs);simStats(L.teams[g.a],as)}
    const wi=winner(g),lo=loser(g);if(rk(lo)&&L.teams[wi].div===L.teams[lo].div&&(!rk(wi)||rk(wi)-rk(lo)>=8))g.upset=true;if(!rk(wi)&&isFCS(L.teams[wi])&&!isFCS(L.teams[lo]))g.upset=true;
    if(g.rival){const t1=L.teams[g.h],t2=L.teams[g.a];t1.holder=t2.holder=wi}
    if(g.bowl)L.teams[wi].bowlWins++;
    if(g.ccg){L.teams[wi].cc=true;L.teams[wi].ccTitles++}
  }
  if(w.kind==='post4'){if(L.cfp&&L.cfp.final){const c=winner(L.cfp.final);L.teams[c].titles++;L.champ=c}if(L.fcsp&&L.fcsp.final){const c=winner(L.fcsp.final);L.teams[c].titles++;L.champF=c}}
  weeklyUpkeep(L);
  invalidate();updateRankings(L);
  L.lastWeek={label:w.label,games:w.games.map(g=>({h:g.h,a:g.a,hs:g.hs,as:g.as,tag:g.tag,upset:g.upset,rh:rk(g.h),ra:rk(g.a)}))};
  pickPOTW(L,w);
  L.heismanWatch=heismanTop(L,5).map(x=>({pid:x.p.id,name:fullName(x.p),pos:x.p.pos,team:x.t.id,line:statLine(x.p)}));
  if(w.kind==='post0')awardHeisman(L);
  for(const g of w.games)if(g.upset&&L.news.length<40){const wt=L.teams[winner(g)],lt=L.teams[loser(g)];L.news.unshift({t:`Upset: ${wt.city} beats ${rk(lt.id)?'#'+rk(lt.id)+' ':''}${lt.city}, ${Math.max(g.hs,g.as)}–${Math.min(g.hs,g.as)}.`})}
  L.news=L.news.slice(0,30);
  L.week++;
  if(L.week>=L.R&&L.week<=L.R+4)buildPost(L);
  if(L.week>L.R+4)return startOffseason(L);

const adTarget=t=>Math.round((t.div==='FCS'?4.5:3.5)+t.prestige*1.4);

  L.phase='offseason';L.event=null;const u=L.teams[L.user];L.coach.seasons++;
  const madePO=!!((L.cfp&&L.cfp.seeds.includes(L.user))||(L.fcsp&&L.fcsp.seeds.includes(L.user))),champ=L.champ===L.user||L.champF===L.user;

function departures(L){
  const draftPool=[],user=L.teams[L.user],out={grads:[],declares:[],portalOut:[],drafted:[]};L.off.portalPool=[];
  for(const t of L.teams){
    const keep=[];
    for(const p of t.roster){
      const leave=p.yr>=4&&!(p.redshirt&&p.ss.gp<=4&&!p.rs);
      const declare=!leave&&p.yr===3&&ovr(p)>=4.2&&Math.random()<.55;
      const portal=!leave&&!declare&&p.ss.gp<3&&ovr(p)>=(t.id===L.user?3.2:2.9)&&Math.random()<(t.id===L.user?(L.morale>75?.15:.3):.12);
      if(leave||declare){draftPool.push({p,t,declare});if(t.id===L.user)(declare?out.declares:out.grads).push({name:fullName(p),pos:p.pos,ovr:ovr(p)})}
      else if(portal){if(t.id===L.user)out.portalOut.push({name:fullName(p),pos:p.pos,ovr:ovr(p)});L.off.portalPool.push({...p,from:t.id})}

  }

  draftPool.slice(0,7*32).forEach((x,i)=>{if(x.t.id===L.user)out.drafted.push({name:fullName(x.p),pos:x.p.pos,round:Math.floor(i/32)+1,pick:i+1})});

function recruitInterest(L,stars){const u=L.teams[L.user];return clamp(Math.round(48+u.prestige*11-stars*10+(L.fan-50)/4+(L.coach.natties?6:0)+R(-14,14)),5,96)}
function buildRecruits(L){

  const u=L.teams[L.user];const res=[];

    else if(Math.random()<.35)t.prestige=clamp(t.prestige+(g>=9?1:g<=3?-1:0),1,5);

function bindOffseason(){
  if(LG.phase!=='offseason')return;const o=LG.off;
  on('offNext',()=>{
    if(o.stage==='recap'){departures(LG);o.stage='departures'}
    else if(o.stage==='departures'){jobOffers(LG);if(o.offers.length)o.stage='carousel';else{buildPortal(LG);o.stage='portal'}}
    else if(o.stage==='portal'){buildRecruits(LG);o.stage='recruit'}
    else if(o.stage==='recruit'){signingDay(LG);o.stage='signing'}
    else if(o.stage==='signing'){const camp=startNewSeason(LG);saveNow();showHub('home');$('#hubScroll').scrollTop=0;banner(LG.season+' season','var(--team)');toast(`Camp: ${camp.length} rating upgrades`);return}
    saveNow();showHub('home');$('#hubScroll').scrollTop=0;
  });
  if(o.stage==='carousel'){o.offers.forEach(id=>on('offer-'+id,()=>{takeJob(LG,id);buildPortal(LG);o.stage='portal';saveNow();showHub('home')}));on('stayPut',()=>{buildPortal(LG);o.stage='portal';saveNow();showHub('home')})}
  if(o.stage==='portal')o.portal.forEach((p,i)=>on('tp-'+i,()=>{const u=T(LG.user);const c=portalCost(p);
    if(p.signed){p.signed=false;LG.nil+=c;u.roster=u.roster.filter(x=>x.id!==p.id);const src=T(p.from);if(!src.roster.some(x=>x.id===p.id)&&p.from!==LG.user)src.roster.push(stripPortal(p))}
    else{if(LG.nil<c){toast('Not enough NIL');return}if(u.roster.length>=ROSTER_CAP){toast('Roster is full');return}p.signed=true;LG.nil-=c;const src=T(p.from);src.roster=src.roster.filter(x=>x.id!==p.id);u.roster.push(stripPortal(p));assignNumbers(u)}
    saveNow();rerender()}));
  if(o.stage==='recruit'){
    on('nilBoost',()=>{if(LG.nil>=150&&o.nilBoost<5){LG.nil-=150;o.nilBoost++;saveNow();rerender()}});
    o.recruits.forEach((r,i)=>{on('rof-'+i,()=>{const spent=sum(o.recruits.filter(x=>x.offered).map(recruitCost));if(r.offered){r.offered=false;r.visit=false}else if(spent+recruitCost(r)<=o.rp+o.nilBoost)r.offered=true;else{toast('Not enough points');return}saveNow();rerender()});
      on('rvi-'+i,()=>{const v=o.recruits.filter(x=>x.visit).length;if(r.visit)r.visit=false;else if(v<3)r.visit=true;saveNow();rerender()})});
  }
}

function setRoute(p,name,dir){

function setupFormation(){

  const te=add('o','TE',L-.9,b+3.6*s,o.TE[0]);

/* ---------- simulation ---------- */
function steer(p,tx,ty,spd,dt,acc){const ddx=tx-p.x,ddy=ty-p.y,d=hyp(ddx,ddy);let vx=0,vy=0;if(d>.05){const s=spd*Math.min(1,d/1.1);vx=ddx/d*s;vy=ddy/d*s}const k=Math.min(1,(acc||p.acc)*dt);p.vx+=(vx-p.vx)*k;p.vy+=(vy-p.vy)*k}
const eligible=p=>p.side==='o'&&(p.role==='WR'||p.role==='TE'||p.role==='RB');
function isRunner(){if(!play||!play.carrier||play.carrier.side!=='o')return false;const c=play.carrier;if(c===Q)return play.scramble;return play.type==='pass'?play.caught:play.handed}
function runRoute(p,dt){let t=p.wi<p.route.length?p.route[p.wi]:p.cont;if(p.wi<p.route.length&&hyp(t[0]-p.x,t[1]-p.y)<.9){p.wi++;t=p.wi<p.route.length?p.route[p.wi]:p.cont}if(t)steer(p,t[0],t[1],p.spd,dt);else steer(p,p.x,p.y,0,dt)}
function nearest(list,x,y,f){let b=null,bd=1e9;for(const o of list){if(f&&!f(o))continue;const d=hyp(o.x-x,o.y-y);if(d<bd){bd=d;b=o}}return [b,bd]}
function blockAI(p,dt){
  const pre=play.type==='pass'&&!play.thrown&&!play.scramble&&play.carrier===Q;
  if(p.role==='OL'&&pre){const [dl]=nearest(DEF,p.x,p.y,d=>d.role==='DL');if(dl){const ddx=Q.x-dl.x,ddy=Q.y-dl.y,d=hyp(ddx,ddy)||1;steer(p,dl.x+ddx/d,dl.y+ddy/d,5.2,dt)}return}
  const c=play.carrier||Q;
  if(play.type==='run'&&(p.role==='OL'||p.role==='TE'||(p===RB&&play.qbrun))&&c.x<S.los+1.5){const gx=S.los,gy=play.gapY;const [d]=nearest(DEF,p.x,p.y,o=>!o.immune&&(o.role==='DL'||o.role==='LB'));if(d){const ddx=gx-d.x,ddy=gy-d.y,n=hyp(ddx,ddy)||1;steer(p,d.x+ddx/n*.9,d.y+ddy/n*.9,p.spd,dt);return}}
  const [d]=nearest(DEF,p.x,p.y,o=>!o.immune&&o.stun<=0&&hyp(o.x-c.x,o.y-c.y)<14);
  if(d){const ddx=c.x-d.x,ddy=c.y-d.y,n=hyp(ddx,ddy)||1;steer(p,d.x+ddx/n*.9,d.y+ddy/n*.9,p.spd*.95,dt)}else steer(p,c.x+4,c.y+(p.homeY>c.y?3:-3),p.spd*.8,dt);
}
function controlRunner(c,dt){
  let spd=c.spd*(play.jukeT>0?1.1:1)*(play.slowT>0?.6:1)*(play.dive>0?1.3:1);let vy=0;
  if(touch&&touch.mode==='steer'&&performance.now()-touch.t0>110){const off=touch.y-Y(c.y);if(Math.abs(off)>10)vy=clamp(off/(scE()*VY*2.2),-1,1)*spd*.85}
  if(play.jukeT>0)vy=play.jukeDir*spd*.95;
  if(play.dive>0)vy*=.3;

function driveLines(d,res,yds,plays,label,defTD){

  const myD=[...starters(H,'DL'),...starters(H,'LB'),...starters(H,'CB'),...starters(H,'S')];const dl=starters(H,'DL'),db=[...starters(H,'CB'),...starters(H,'S')],lb=starters(H,'LB');

    else if(g<=0){if(Math.random()<.55){const c=pick(db);t=`${aq.last}'s pass is broken up by ${nm(c)}.`;cls='good';dx(c,'xp',5)}else{const s=pick([...dl,...lb]);t=`${ar.last} stuffed by ${nm(s)}${g<0?' for a loss of '+(-g):''}.`;cls='good';dx(s,'tkl',1);dx(s,'xp',4)}}
    else if(Math.random()<.55){const rc=pick(rcv);t=`${aq.last} to ${rc.last} for ${g}. ${g>=20?'Big play.':''} Tackle by ${nm(tk)}.`;if(g>=20)cls='bad';dx(tk,'tkl',1);dx(tk,'xp',3)}
    else{t=`${ar.last} runs for ${g}. Tackle by ${nm(tk)}.`;if(g>=15)cls='bad';dx(tk,'tkl',1);dx(tk,'xp',3)}

    spot-=g;togo-=g;if(togo<=0){down=1;togo=Math.min(10,Math.max(1,Math.round(spot)))}else{down++;if(down>3){out.push({dd:`4th & ${Math.max(1,Math.round(togo))} · ${spotLabel(10+spot)}`,t:`${pick([aq.last+' sneaks',ar.last+' bulls ahead'])} for the first down. They go for it and convert.`,cls:'bad'});down=1;togo=Math.min(10,Math.max(1,Math.round(spot)))}}
  }

  if(res==='TD'){const rc=pick(rcv);out.push({dd:ddT,t:Math.random()<.55?`${aq.last} hits ${rc.last} for a ${finalGain}-yard TOUCHDOWN.`:`${ar.last} breaks free for a ${finalGain}-yard TOUCHDOWN.`,cls:'bad big'})}
  else if(res==='FG')out.push({dd:'4th down · '+spotLabel(10+spot),t:`Field goal from ${Math.round(spot+17)} yards is good.`,cls:'bad'});
  else if(res==='PUNT')out.push({dd:'4th down · '+spotLabel(10+spot),t:`${S.away.abbr} punts. Your defense gets off the field.`,cls:'good'});
  else if(res==='TO'){const c=pick(label.includes('ick')||label==='Interception'?db:[...lb,...dl]);dx(c,label.includes('ick')||label==='Interception'?'dint':'tkl',1);dx(c,'xp',defTD?40:25);out.push({dd:ddT,t:(label==='Interception'||label==='Pick six!')?`INTERCEPTED by ${nm(c)}!${defTD?' He takes it all the way back for a touchdown!':''}`:`FUMBLE! Recovered by ${nm(c)}!${defTD?' Scoop and score!':''}`,cls:'good big'})}

}

let last=performance.now(),hudAcc=0,lastSbHidden=null;
function frame(now){
  const real=Math.min(.05,(now-last)/1000);last=now;
  if(lastSbHidden!==$('#sb').hidden){lastSbHidden=$('#sb').hidden;resize()}
  if(S.slowT>0){S.slowT-=real;S.ts=.32}else S.ts=Math.min(1,S.ts+real*2.5);
  const dt=real*S.ts;
  const active=!S.paused&&!['hub','boot','over','menu'].includes(S.phase);
  if(active){
    if(S.phase==='presnap'&&!S.conv){S.playClock-=real;if(S.playClock<=0)delayOfGame()}
    if(S.phase==='kick'){updateKick(real);drawKick()}
    if((S.phase==='live'||S.phase==='dead')&&play){const n=dt>.02?3:2;for(let i=0;i<n;i++)simulate(dt/n);if(S.phase==='dead'){deadT-=real;if(deadT<=0)applyResult()}}
    else for(const p of P){p.fallP=lerp(p.fallP,p.fallen?1:0,.12);p.z=Math.max(0,(p.z||0)-real*3)}
    updateParticles(dt);updateWeather(real);updateCam(real);draw(now);
    hudAcc+=real;if(hudAcc>.1){hudAcc=0;hud()}
  }
  requestAnimationFrame(frame);
}
