# XcodeGen spec. Generate the Xcode project with:  cd ios && xcodegen generate
name: GridironLive
options:
  bundleIdPrefix: com.gridironlive
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  GridironLive:
    type: application
    platform: iOS
    sources:
      - path: GridironLive
      # The whole web/ folder is copied into the app bundle as "web/"
      - path: ../web
        type: folder
        buildPhase: resources
    info:
      path: GridironLive/Info.plist
      properties:
        CFBundleDisplayName: Gridiron Live
        CFBundleName: GridironLive
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gridironlive.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    scheme: {}
